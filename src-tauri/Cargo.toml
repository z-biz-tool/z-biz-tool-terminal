[package]
name = "z-biz-tool-terminal"
version = "0.2.1"
description = "服务器连接管理器 - 对标Xshell/Tabby"
edition = "2021"
license = "MIT"

[lib]
name = "z_biz_tool_terminal_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 家族统一深链协议（cap-hub）：zbiz:// 的构造、解析、待处理队列与产品清单。
cap-hub = { path = "../../z-biz-tool-capability/crates/cap-hub", version = "0.1.0", features = ["tauri"] }
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
russh = "0.45"
russh-keys = "0.45"
ssh-key = { version = "0.6", features = ["ed25519"] }
async-trait = "0.1.92"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
dirs = "5"
russh-sftp = "2.0"
chrono = "0.4"
sha2 = "0.10"
data-encoding = "2"
aes-gcm = "0.10.3"
# 能力共享层：协议/鉴权/SSE/脱敏统一在 cap-llm，terminal 不再自建请求代码
cap-llm = { path = "../../z-biz-tool-capability/crates/cap-llm", version = "0.1.0" }
# 家族统一 LLM 配置存储：配置落 ~/.z-biz-tool/llm/config.json，
# 密钥进 OS 密钥库（service="z-biz-tool"，跨应用共享同一条目）。
cap-llm-config = { path = "../../z-biz-tool-capability/crates/cap-llm-config", version = "0.1.0" }

# ---- 体积与构建产物治理（2026-11-03 全仓统一）----
# release 关闭调试符号与增量编译：产物体积约为 debug 的 1/3~1/5，
# 且避免 incremental/ 缓存随编译会话无限累积（Tauri 家族 16 仓曾累积 80GB+）。
[profile.release]
debug = false
incremental = false
strip = "symbols"
