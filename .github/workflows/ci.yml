name: CI

# 与 build.yml 分离：build.yml 只在打 tag 时产出安装包，
# 这里守的是每次 push/PR 的最小可门禁（typecheck / 测试 / 编译）。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # lockfile 的 resolved 已统一指向 registry.npmjs.org（2026-10-03），无需钉 registry
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (esbuild + node assertions)
        run: npm test

      - name: Build
        run: npm run build

  backend:
    # macOS runner 不需要 webkit2gtk 等系统依赖，编译最快；
    # 跨平台产物仍由 build.yml 的四平台矩阵负责。
    runs-on: macos-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      # cap-llm / cap-doc 走 ../../z-biz-tool-capability path 依赖；runner 上只有本仓，
      # 把公共能力仓取到 workspace 内，再链接到 src-tauri 的同级目录。
      - name: Checkout capability (path deps)
        uses: actions/checkout@v4
        with:
          repository: z-biz-tool/z-biz-tool-capability
          path: .capability

      - name: Link capability (Unix)
        if: runner.os != 'Windows'
        run: ln -sfn "$GITHUB_WORKSPACE/.capability" "$GITHUB_WORKSPACE/../z-biz-tool-capability"

      - name: Link capability (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Junction -Path "$env:GITHUB_WORKSPACE\..\z-biz-tool-capability" -Target "$env:GITHUB_WORKSPACE\.capability" | Out-Null

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Workaround: GitHub's new token format (2026-08) corrupts the cargo config
      # that dtolnay/rust-toolchain writes; see build.yml.
      - name: Reset broken cargo config
        run: rm -f "$HOME/.cargo/config.toml"

      - name: Format check
        run: cargo fmt --check

      - name: Tests
        run: cargo test --lib

      # 2026-10-20：clippy 存量 warning 已清零（--all-targets 下 0 条），
      # 从"只做可见性不卡门禁"改成真正的门禁。
      #
      # 此前是 continue-on-error，理由是"存量 17 条未清零"——
      # 那个理由现在不成立了，而门禁放着不卡，等于没有门禁：
      # 下一个人新引入 100 条 warning，CI 照样绿。
      #
      # -D warnings：任何 warning 都让这一步失败。
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
