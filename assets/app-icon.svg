<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B7A75"/>
      <stop offset="1" stop-color="#123C6E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7FF9E8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#7FF9E8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="72" y="72" width="880" height="880" rx="232" fill="url(#bg)"/>

  <!-- 窗口外壳 -->
  <rect x="212" y="272" width="600" height="480" rx="80" fill="#FFFFFF"/>

  <!-- 三颗交通灯 -->
  <circle cx="282" cy="336" r="22" fill="#FF6B6B"/>
  <circle cx="344" cy="336" r="22" fill="#F6A623"/>
  <circle cx="406" cy="336" r="22" fill="#34E8D2"/>

  <!-- 终端屏幕 -->
  <rect x="252" y="384" width="520" height="328" rx="48" fill="#122A33"/>
  <circle cx="400" cy="548" r="170" fill="url(#glow)"/>

  <!-- 提示符 -->
  <path d="M320 500 L396 572 L320 644"
        fill="none" stroke="#34E8D2" stroke-width="44"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="452" y="556" width="216" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.55"/>
  <rect x="452" y="632" width="120" height="36" rx="18" fill="#7FF9E8"/>
</svg>
